# XcodeGen project spec - source of truth for Markdown Quick Look.xcodeproj.
#
# Regenerate after editing this file:
#   xcodegen generate
#
# See openspec/changes/add-markdown-quicklook-preview/design.md - Decision 1
# (host app + embedded QLPreviewingController App Extension).
name: Markdown Quick Look

options:
  bundleIdPrefix: com.jmurphy.markdownquicklook
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  Markdown Quick Look:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/MarkdownQuickLook
    dependencies:
      - target: MarkdownQuickLookExtension
        embed: true
    settings:
      base:
        PRODUCT_NAME: "Markdown Quick Look"
        PRODUCT_BUNDLE_IDENTIFIER: com.jmurphy.markdownquicklook
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/MarkdownQuickLook/MarkdownQuickLook.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Markdown Quick Look"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  MarkdownQuickLookExtension:
    type: app-extension
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/MarkdownQuickLookExtension
        excludes:
          - "Resources/vendor/**"
      # Folder reference (not a group) - preserves the on-disk directory
      # structure inside Contents/Resources/vendor/ in the built .appex.
      # This matters because katex.min.css references its fonts via
      # relative `url(fonts/...)` paths, which would break if Xcode
      # flattened everything into a single Resources/ directory.
      - path: Sources/MarkdownQuickLookExtension/Resources/vendor
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: "MarkdownQuickLookExtension"
        PRODUCT_BUNDLE_IDENTIFIER: com.jmurphy.markdownquicklook.PreviewExtension
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Sources/MarkdownQuickLookExtension/MarkdownQuickLookExtension.entitlements
        INFOPLIST_FILE: Sources/MarkdownQuickLookExtension/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SKIP_INSTALL: YES

  MarkdownQuickLookExtensionTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/MarkdownQuickLookExtension
        excludes:
          - "Resources/vendor/**"
          - "Info.plist"
      - path: Tests/MarkdownQuickLookExtensionTests
    settings:
      base:
        PRODUCT_NAME: "MarkdownQuickLookExtensionTests"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "13.0"

schemes:
  Markdown Quick Look:
    build:
      targets:
        Markdown Quick Look: all
        MarkdownQuickLookExtension: all
        MarkdownQuickLookExtensionTests: all
    test:
      targets:
        - MarkdownQuickLookExtensionTests
    run:
      config: Debug
    archive:
      config: Release
